name: Compilar plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.nombre }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nombre: Windows
            os: windows-latest
          - nombre: macOS
            os: macos-latest
          - nombre: Linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxinerama-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev \
            libgl1-mesa-dev libcurl4-openssl-dev

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empaquetar (.vst3)
        shell: bash
        run: |
          mkdir -p dist
          find build -name "*.vst3" -maxdepth 6 -exec cp -R {} dist/ \;
          ls -la dist
          cd dist && 7z a -tzip ../DiabloGlitch2K-${{ matrix.nombre }}.zip . > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: DiabloGlitch2K-${{ matrix.nombre }}
          path: DiabloGlitch2K-${{ matrix.nombre }}.zip

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artefactos/*.zip
